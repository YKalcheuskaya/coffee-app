name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check Docker for required PostgreSQL acceptance tests
        run: docker info
      - name: Run fast tests, HTTP acceptance tests, and coverage
        run: mvn --batch-mode clean verify
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Coffee App verification\n\n")
              summary.write("| Suite | Tests | Failures | Errors | Skipped |\n")
              summary.write("| --- | ---: | ---: | ---: | ---: |\n")
              for directory, label in [("surefire-reports", "Fast tests"),
                                       ("failsafe-reports", "HTTP acceptance tests")]:
                  reports = list(Path("target", directory).glob("TEST-*.xml"))
                  if not reports:
                      summary.write(f"| {label} | No report | — | — | — |\n")
                      continue
                  totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
                  for report in reports:
                      suite = ET.parse(report).getroot()
                      for key in totals:
                          totals[key] += int(suite.get(key, "0"))
                  summary.write(f"| {label} | " + " | ".join(str(value) for value in totals.values()) + " |\n")
              summary.write("\nDownload `verification-reports` for detailed results and the JaCoCo HTML report.\n")
          PY
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: error
          retention-days: 14
